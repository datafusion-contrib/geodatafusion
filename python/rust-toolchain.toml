# This crate talks to `datafusion-python` through datafusion-ffi capsules.
# Their private data embeds `Option<tokio::runtime::Handle>`, a `repr(Rust)`
# value with no FFI contract, and the encoding of its `None` discriminant is
# compiler-version dependent: rustc 1.97 encodes it as `0xff..ff`, rustc 1.99
# as `2`. Building the extension with 1.99 therefore hands the host a `None`
# that the host reads as `Some` with an uninitialized pointer, and the first
# table-function call segfaults the interpreter.
#
# Pin the compiler that the target datafusion-python release pins: 1.97.0 for
# datafusion-python 55.x, whose own `rust-toolchain.toml` carries the same
# value. Change this together with the host, not on its own.

[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
