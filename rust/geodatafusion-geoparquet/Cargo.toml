[package]
name = "geodatafusion-geoparquet"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "GeoParquet FileFormat support for DataFusion"
readme = "README.md"
categories = { workspace = true }
rust-version = { workspace = true }


[dependencies]
arrow-schema = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-datasource-parquet = { workspace = true }
geoarrow-schema = { workspace = true }
geoparquet = { workspace = true }
object_store = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
arrow-array = { workspace = true }
datafusion = { workspace = true, features = ["sql"] }
geo-traits = { workspace = true }
geoarrow-array = { workspace = true, features = ["test-data"] }
geodatafusion = { workspace = true }
object_store = { workspace = true, features = ["http"] }
parquet = { version = "59", default-features = false, features = ["arrow"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }
wkt = { workspace = true }

[package.metadata.docs.rs]
all-features = true
