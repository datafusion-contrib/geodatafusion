[package]
name = "geodatafusion"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Spatial extensions for Apache DataFusion"
categories = { workspace = true }
rust-version = { workspace = true }


[features]
# Enables GEOS-backed UDFs.
# We only use explicitly versioned flags,
# and the structure should be recursive
# (with higher version targets implying lower version ones
# in a chain.)
geos-3_11 = ["geos/v3_11_0"]

[dependencies]
arrow-arith = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }
datafusion = { workspace = true }
geo = { workspace = true }
geo-traits = { workspace = true }
geoarrow-array = { workspace = true }
geoarrow-expr-geo = { workspace = true }
geoarrow-schema = { workspace = true }
geohash = { workspace = true }
geos = { workspace = true, optional = true }
thiserror = { workspace = true }
wkt = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true, features = ["sql"] }
geo-traits = { workspace = true }
geoarrow-array = { workspace = true, features = ["test-data"] }
hex = "0.4"
object_store = { workspace = true, features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
sqllogictest = "0.29.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
wkb = { workspace = true }

[[test]]
name = "sqllogictests"
harness = false

[package.metadata.docs.rs]
all-features = true
