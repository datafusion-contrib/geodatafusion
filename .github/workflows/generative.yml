name: Generative Checks

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-extended:
    name: Extended property tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      GDF_PROP_CASES: 2048
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run extended properties
        run: |
          cargo test -p geodatafusion \
            --test property_tests \
            --test codec_properties \
            --test linear_properties \
            --locked

  parser-fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-14
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure fuzz paths
        run: |
          {
            echo "FUZZ_CORPUS=$RUNNER_TEMP/geodatafusion-fuzz-corpus"
            echo "FUZZ_TARGET_DIR=$RUNNER_TEMP/geodatafusion-fuzz-target"
          } >> "$GITHUB_ENV"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz formatting
        run: |
          cargo +nightly-2026-07-14 fmt \
            --manifest-path fuzz/Cargo.toml \
            --all \
            -- \
            --check \
            --unstable-features \
            --config imports_granularity=Module,group_imports=StdExternalCrate
      - name: Lint fuzz targets
        run: |
          cargo +nightly-2026-07-14 clippy \
            --manifest-path fuzz/Cargo.toml \
            --all-targets \
            --locked \
            -- \
            -D warnings
      - name: Check isolated fuzz workspace
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Build fuzz targets
        run: |
          cargo +nightly-2026-07-14 fuzz build \
            --fuzz-dir fuzz \
            --target-dir "$FUZZ_TARGET_DIR"
      - name: Prepare fixed seed corpus
        run: |
          mkdir -p "$FUZZ_CORPUS/parse_wkt" "$FUZZ_CORPUS/parse_wkb"
          cp fuzz/seeds/parse_wkt/* "$FUZZ_CORPUS/parse_wkt/"
          cp fuzz/seeds/parse_wkb/* "$FUZZ_CORPUS/parse_wkb/"
      - name: Fuzz WKT parser
        run: |
          cargo +nightly-2026-07-14 fuzz run \
            --fuzz-dir fuzz \
            --target-dir "$FUZZ_TARGET_DIR" \
            -j 1 \
            parse_wkt "$FUZZ_CORPUS/parse_wkt" -- \
            -runs=10000 -max_len=4096 -timeout=10
      - name: Fuzz WKB parser
        run: |
          cargo +nightly-2026-07-14 fuzz run \
            --fuzz-dir fuzz \
            --target-dir "$FUZZ_TARGET_DIR" \
            -j 1 \
            parse_wkb "$FUZZ_CORPUS/parse_wkb" -- \
            -runs=10000 -max_len=4096 -timeout=10
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Scheduled/manual only: building pinned GEOS on every PR is too expensive.
  geos-minimum:
    name: GEOS ${{ matrix.geos_version }} minimum runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - geos_version: "3.11.5"
            geos_sha256: 7d9432f94e2c743cca13977b1f9943dfcc9a83854578870a215fb8dd7d6f21c1
            cargo_feature: geos-3_11
          - geos_version: "3.12.1"
            geos_sha256: d6ea7e492224b51193e8244fe3ec17c4d44d0777f3c32ca4fb171140549a0d03
            cargo_feature: geos-3_12
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      GEOS_VERSION: ${{ matrix.geos_version }}
      GEOS_SHA256: ${{ matrix.geos_sha256 }}
      GEODATAFUSION_EXPECT_GEOS_VERSION: ${{ matrix.geos_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GEOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Configure pinned GEOS paths
        run: |
          {
            echo "GEOS_PREFIX=$RUNNER_TEMP/geos-$GEOS_VERSION"
            echo "GEOS_LIB_DIR=$RUNNER_TEMP/geos-$GEOS_VERSION/lib"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/geos-$GEOS_VERSION/lib"
          } >> "$GITHUB_ENV"
      - name: Cache pinned GEOS
        id: geos-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/geos-${{ env.GEOS_VERSION }}
          key: geos-${{ env.GEOS_VERSION }}-${{ env.GEOS_SHA256 }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build pinned GEOS
        if: steps.geos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/geos-$GEOS_VERSION.tar.bz2"
          source_dir="$RUNNER_TEMP/geos-$GEOS_VERSION-source"
          build_dir="$RUNNER_TEMP/geos-$GEOS_VERSION-build"

          curl -fL -o "$archive" \
            "https://download.osgeo.org/geos/geos-$GEOS_VERSION.tar.bz2"
          echo "$GEOS_SHA256  $archive" | sha256sum -c -
          mkdir -p "$source_dir" "$build_dir"
          tar -xjf "$archive" -C "$source_dir"

          cmake -S "$source_dir/geos-$GEOS_VERSION" -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEOS_PREFIX" \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF
          cmake --build "$build_dir" --target install -j"$CARGO_BUILD_JOBS"
      - name: Build minimum test binaries
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/geos-$GEOS_VERSION-artifacts.json"
          binaries="$RUNNER_TEMP/geos-$GEOS_VERSION-binaries.txt"

          cargo test -p geodatafusion --features ${{ matrix.cargo_feature }} --locked \
            --no-run --message-format=json-render-diagnostics > "$artifacts"
          jq -r 'select(
            .reason == "compiler-artifact"
            and .executable != null
            and .profile.test == true
          ) | .executable' "$artifacts" | sort -u > "$binaries"
          test -s "$binaries"
      - name: Check pinned GEOS sentinel and linkage
        run: |
          set -euo pipefail
          runtime_bin=$(grep -E '/geos_runtime-' "$RUNNER_TEMP/geos-$GEOS_VERSION-binaries.txt" | head -n 1)
          test -n "$runtime_bin"

          LD_LIBRARY_PATH="$GEOS_LIB_DIR" \
            GEODATAFUSION_EXPECT_GEOS_VERSION="$GEOS_VERSION" \
            "$runtime_bin" --nocapture
          ldd "$runtime_bin" | grep -F "$GEOS_LIB_DIR/libgeos_c"
      - name: Run minimum suite
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r binary; do
            test -n "$binary" || continue
            echo "::group::$(basename "$binary")"
            if ! LD_LIBRARY_PATH="$GEOS_LIB_DIR" \
              GEODATAFUSION_EXPECT_GEOS_VERSION="$GEOS_VERSION" \
              "$binary"; then
              status=1
              echo "::error::$(basename "$binary") failed with GEOS $GEOS_VERSION"
              ldd "$binary" | grep -i geos || true
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/geos-$GEOS_VERSION-binaries.txt"
          exit "$status"
