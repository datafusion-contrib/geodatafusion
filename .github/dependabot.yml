version: 2
updates:
  # Root Cargo workspace (rust/ crates)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # DataFusion, Arrow, and object_store are released and bumped together
      datafusion:
        patterns:
          - "datafusion*"
          - "arrow*"
          - "parquet*"
          - "object_store"
      rust-dependencies:
        patterns:
          - "*"
    # Keep Arrow-family, GeoArrow/GeoParquet, and FlatGeobuf versions compatible
    # with datafusion 55 (Arrow 59) so workspace traits remain aligned.
    ignore:
      - dependency-name: "arrow*"
        versions: [">= 60.0.0"]
      - dependency-name: "parquet*"
        versions: [">= 60.0.0"]
      - dependency-name: "object_store"
        versions: [">= 0.14.0"]
      - dependency-name: "geoarrow*"
        versions: [">= 0.10.0"]
      - dependency-name: "geoparquet"
        versions: [">= 0.10.0"]
      - dependency-name: "flatgeobuf"
        versions: [">= 6.0.0"]

  # Python binding Cargo project (excluded from the root workspace)
  - package-ecosystem: cargo
    directory: "/python"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # DataFusion, Arrow, and object_store are released and bumped together
      datafusion:
        patterns:
          - "datafusion*"
          - "arrow*"
          - "parquet*"
          - "object_store"
      python-rust-dependencies:
        patterns:
          - "*"
    # Keep Arrow-family, GeoArrow/GeoParquet, and FlatGeobuf versions compatible
    # with datafusion 55 (Arrow 59) across the Python binding and path crates.
    ignore:
      - dependency-name: "arrow*"
        versions: [">= 60.0.0"]
      - dependency-name: "parquet*"
        versions: [">= 60.0.0"]
      - dependency-name: "object_store"
        versions: [">= 0.14.0"]
      - dependency-name: "geoarrow*"
        versions: [">= 0.10.0"]
      - dependency-name: "geoparquet"
        versions: [">= 0.10.0"]
      - dependency-name: "flatgeobuf"
        versions: [">= 6.0.0"]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
