# Test-only target manifest for every function listed in README.md.
#
# Extra registrations that are intentionally outside the README target snapshot
# use additional [[function]] entries with readme_checked = false. Their exact
# (name, kind) must match a function added by the public registration entry point.
#
# State definitions:
#   planned  - not user-visible through the public registration entry point.
#   partial  - registered or claimed, but the acceptance contract is incomplete
#              or a known defect is recorded in reason.
#   verified - registered through the public entry point and backed by checked-in
#              contract and raw-Arrow evidence listed below.
#
# Evidence entries are either repository-relative files or
# "path::test_name" references. The registration audit validates that every
# referenced path exists and is anchored to the named function or test.

