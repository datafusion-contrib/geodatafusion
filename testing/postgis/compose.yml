name: geodatafusion-postgis

services:
  postgis:
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    platform: linux/amd64
    environment:
      POSTGRES_USER: geodatafusion
      POSTGRES_PASSWORD: geodatafusion
      POSTGRES_DB: geodatafusion
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geodatafusion -d geodatafusion"]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 10s
